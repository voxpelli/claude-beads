  - id: vp-beads-l9i
    title: Tracker migration off bd
    status: pending
    type: task
    priority: high
    labels:
      - epic
    description: >-
      Parent epic for all work migrating vp-beads off the bd substrate (gastownhall/beads). Driven
      by the operational complexity-delta of bd-on-Dolt (daemon + dynamic ports + binary DB trees +
      dual-store JSONL↔Dolt sync + migrations + orphan-process reaping) — unredeemed for a solo
      single-host dev who turns off its reason-to-exist (cross-machine Dolt merge). Strategic
      incoherence with Gas Town is positioning, not technical forcing.


      SUBSTRATE (v3 verdict, 2026-06-09, superseding the l9i.2 MIXED→Backlog.md verdict): **Option C
      — lean in-repo flat-YAML** (`backlog/tasks/tasks-<slug>.yml`) + `scripts/ready-walker.mjs`
      (the files-native `bd ready`) + `validate-tasks.mjs` (integrity gate) + the canonical
      `scripts/task-schema.mjs`. Zero new runtime deps; no daemon/MCP/index; writes are ordinary
      Edit/Write (no CRUD helper — substrate-not-opinion). Type model settled by decision
      `vp-beads-etm` (2026-06-10): 4 types (task/doc/decision/milestone) + `labels:` framings. See
      `DESIGN-tracker-exploration.md` v3 block + `RESEARCH-tracker-migration-synthesis-2026-06.md`.


      ## Success Criteria


      - Phase 0 read/validate tooling ships and holds green in `npm run check` (DONE 2026-06-10)

      - The 4-vs-9 type model is settled in a decision bead and implemented in the canonical schema
      (DONE — `vp-beads-etm`, 4 types)

      - Skill-retarget wave (`e42` + `azl`): 7 skills + 3 hooks + sprint-review agent run against
      ready-walker/YAML; `### Files-availability convention` replaces Beads-availability

      - `migrate-from-bd.mjs` (`bj7`) maps bd JSONL → tasks-<slug>.yml losslessly within the decided
      9→4 collapse (framings → labels, epic → parent)

      - Fresh-context independent reviewer (`iai`) lands in the swarm-wave post-wave gate

      - Cutover sprint: bd retired; CLAUDE.md + MEMORY.md drop bd references; v1.0.0-style release
      cut at cutover (cutover checklist addition, 2026-07-02 review round: also grep-sweep + drop
      the "per CLAUDE.md issue-type table" citations in scripts/ready-walker.mjs and
      scripts/task-schema.mjs headers, and re-point/retire the vp-beads-etm / vp-beads-bj7 bead-ID
      references in code comments -- both will dangle once bd is retired)
    updated: '2026-07-02'
