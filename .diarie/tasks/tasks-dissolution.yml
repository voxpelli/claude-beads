      - >-
        Chesterton's-Fence pass: every earned behaviour preserved verbatim — the Files-availability
        tiers, sibling-sync Mode-A/B reciprocal-gap detection, private-sibling/overlay invariants,
        BM section-ownership — ENUMERATED before merging
      - 'Re-unioned `allowed-tools` across the four; description ≤1024 chars (agentskills limit) and triggers cleanly'
      - >-
        `.ledger/` store migration explicitly DEFERRED — ledger v1 operates on existing
        SYNERGY-*.md / UPSTREAM-*.md markdown (do NOT drag the store rebuild into the merge)
    description: >-
      The single biggest unit in the plan — treat as its own scoped effort, not a bullet. A harder
      merge than PR #8's 2-way `/intel` (four intricate skills incl. sibling-sync's bilateral logic
      + private-sibling handling). Plan step 1.3 (ledger bullet). Store migration tracked separately
      under Deferred (trigger: ledger v1 stable).
    updated: '2026-07-18'

