  - id: vp-beads-sss
    title: 'P1.5 Shard session-start.sh across the owning plugins (B2 blocker)'
    status: pending
    type: task
    priority: medium
    parent: vp-beads-dis
    deps:
      - vp-beads-wsk
      - backlog/vp-beads-vhn
    labels:
      - chore
    acceptance_criteria:
      - >-
        each block routed to its owning plugin's hooks/ — tracker_prime, collect_in_progress_claims,
        diarie_ready_cmd and post-tasks-validate.sh → a NEW `plugins/diarie` plugin;
        check_beads_credential_key → diarie-adopt; collect_open_upstream_files, collect_capture_nudge,
        check_private_overlays and check_dormancy → ledger; collect_recent_sprint_files → swarm-wave
      - >-
        `plugins/diarie` is a fifth workspace built HERE but shaped to LEAVE — destined for
        `voxpelli/diarie-skills` on the `ast-grep/agent-skill` pattern, extracted later via
        `git subtree split` (row vp-beads-dsx). Self-containment is the acceptance criterion:
        every gate that touches it must be local and travel with it
      - >-
        `emit_context` is COPIED into each shard, never re-hand-rolled — it is the output contract,
        and a shard that writes its own jq re-opens the dropped-payload hole. Each shard also needs
        its own hookEventName test; `deliveredContext` cannot know which event a given hook is wired to
      - >-
        each shard LABELS ITS OWN compaction output rather than one plugin owning a shared preamble,
        so a user who installs only one plugin still gets framed output
      - >-
        check_dependabot is DROPPED, not routed (vp-beads-hkx) — no clean owner, duplicates a signal
        GitHub already surfaces at push time, and its own comment concedes it is not authoritative
      - >-
        the RETRO mod-4 counter is DROPPED here and rebuilt in vp-knowledge session-reflect (handoff
        #1) — it cannot survive as a file-count once RETRO dissolves into BM notes
      - 'BM-failure-classify stays vp-knowledge''s (do not duplicate vp-knowledge hooks) — MOOT since 2026-07-29: vp-beads'' copy was deleted outright (vp-beads-hkd), so there is nothing left here to route'
      - >-
        REVIVED 2026-08-05. Both deferral premises are settled and the third is withdrawn.
        (1) `anthropics/claude-code#16538` is NOT evidence for anything here — vp-beads-hkx measured
        the real discriminator, and it is ENVELOPE SHAPE, not the plugin boundary: every hook in this
        repo emitted a bare `{"additionalContext": …}`, which Claude Code discards, while Anthropic's
        own envelope-shaped hooks delivered in the same transcripts. Cross-plugin aggregation is
        confirmed, so the "four hooks where only the first is read" risk does not exist.
        (2) vp-beads-46k is the WRONG CITATION — it ruled against splitting ONE plugin's hook into
        several files, which is the opposite structure from each plugin owning one.
        (3) The adversarial architect's objection was "don't shard a broken emitter"; hkx fixed and
        RED-proved the emitter first, which dissolves it
      - >-
        BLOCKED-ON: vp-beads-vgp (now a real dep, not a note). `validate-plugin.mjs` reads exactly
        `join(ROOT, 'hooks', 'hooks.json')`, so the nested `plugins/*/hooks/hooks.json` this row
        creates would land unvalidated
      - >-
        root-scoped gates that go RED when `hooks/` empties, and must be retargeted with a RED-proof
        in the new location: `check:sh` (`shellcheck hooks/*.sh`) and check-hooks.mjs's
        `const HOOKS = join(ROOT, 'hooks')`. Also add `plugins/*/hooks/**` to POPULATED_SURFACES in
        check-prose-commands.mjs — that surface is scanned but not floored, so it can silently empty
      - >-
        SUPERSEDED IN PART by vp-beads-46k (2026-07-29), which took the composable half: the hook is
        now ten named collectors, each carrying a `[shard destination: X]` header naming the plugin
        it would move to. The shard is now a file-move of whole functions rather than a re-cut, so
        deferring costs less than it did when this row was written
      - >-
        NOTE the third AC above ("BM-failure-classify stays vp-knowledge's") reads as routing for a
        future shard — it is NOT. vp-beads-hkd found that duplicate hook FIRING TODAY, in the
        released 0.18.0 cache. Fix it there, not here
    description: >-
      Plan step 1.5. The mega-hook spans ≥4 destinations; name each block's destination explicitly.
      Related but distinct from the backlog row about extracting session-start concerns into named
      functions (that refactors within one hook; this shards across plugins).
    updated: '2026-07-29'

