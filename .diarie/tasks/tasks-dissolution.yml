  slug: dissolution
  title: vp-beads dissolution → the vp-skills workspace-monorepo constellation
tasks:
  - id: vp-beads-dis
    title: vp-beads dissolution → vp-skills monorepo constellation (epic)
    status: pending
    type: task
    priority: high
    labels:
      - epic
    description: >-
      Parent epic for dissolving vp-beads — the only plugin organised by a PROCESS (the sprint)
      rather than a SUBSTRATE — into the approved two-repo-plus-diarie constellation. Governed by
      decision `vp-beads-cst` (supersedes `vp-beads-lgr` own-repo verdict; overrides DESIGN §4 /
      `vp-beads-ski`; specifies `vp-beads-dep`'s execution trigger). Full staged plan:
      `~/.claude/plans/eager-jingling-scone.md`.


      Target topology: `voxpelli/vp-skills` (this repo `claude-beads` renamed — an npm-workspaces
      MAINTENANCE monorepo: root owns only shared lint/tooling, each plugin a self-contained
      workspace, zero cross-plugin refs; distribution stays decoupled, exit preserved) holding
      plugins `ledger` (upstream+synergy+vendor+sibling merged), `swarm-wave`, `diarie-adopt`
      (migrate+deintegrate), plus `vp-git` + `vp-astgrep` brought in; `voxpelli/vp-knowledge`
      (`vp-claude` renamed — own repo/marketplace, absorbs `retrospective`→`session-reflect`);
      `voxpelli/diarie` (already extracted, publishes on its own track).


      Phase 0 is DONE (committed 62d274b): the `cst` decision, `SYNERGY-diarie.md` + registry entry,
      the two `handoffs/*.md`, and the marketplace-mechanics BM note. This epic tracks Phase 1 (the
      local monorepo conversion — the bulk) and Phase 2 (the GitHub-facing, per-step-gated cutover).
      Cross-actor work owned by other repos ([vpk] vp-knowledge follow-ups, [diarie] publishing) is
      tracked via the two handoff docs, not by rows here.
    updated: '2026-07-18'

  # ---- Phase 1 — the monorepo conversion (local, publish-independent; the BULK) ----

  - id: vp-beads-wsk
    title: 'P1.1 Stand up the npm-workspace skeleton (plugins/* + two manifests each)'
    status: completed
    type: task
    priority: high
    parent: vp-beads-dis
    labels:
      - chore
    acceptance_criteria:
      - >-
        Root package.json declares `workspaces: ["plugins/*"]` (diarie was externalized to a
        `file:../diarie` dependency in 85600aa — it is NOT a workspace; later flipped to the
        published npm `^0.2.0` dep)
      - >-
        Layout per anthropics/claude-code: each plugin at `plugins/<name>/` with
        `.claude-plugin/plugin.json` + root-level `skills/ agents/ hooks/`
      - >-
        Each plugin carries TWO manifests — package.json (workspace member; owns the `check:`
        script the root delegates to; kept `private`/no-version) and .claude-plugin/plugin.json
        (Claude manifest; its `version` is authoritative — never also set in the marketplace entry)
        — proven when the first real plugin lands (`_placeholder` has no `.claude-plugin/plugin.json`)
      - '`npm run check` green; `npm run check --workspaces --if-present` delegates cleanly'
    description: >-
      SKELETON DONE: `workspaces: ["plugins/*"]` declared, `check-workspaces` delegates, and
      `plugins/_placeholder/` keeps the glob non-empty (delete when the first real plugin lands).
      REMAINING folds into P1.3 — the two-manifest pattern (`.claude-plugin/plugin.json` + workspace
      `package.json`) and the `plugins/<name>/` layout are PROVEN by the first real plugin landing,
      not by the placeholder (which carries no plugin payload). This row stays `in_progress` until
      then.
      Foundational: nothing else in Phase 1 can move until the workspace exists. Plan step 1.1;
      generalises the existing "THE WORKSPACE OWNS ITS GATES; THE ROOT DELEGATES" pattern (today one
      diarie workspace) to N plugin-workspaces. See `~/.claude/plans/eager-jingling-scone.md` Phase 1.
    updated: '2026-07-18'

