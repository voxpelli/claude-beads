  # ---- The hook-delivery correction and the root retirement (2026-08-05) ----

  - id: vp-beads-hkx
    title: 'Hooks never delivered anything — wrap every emit in hookSpecificOutput'
    status: completed
    type: task
    priority: high
    parent: vp-beads-dis
    labels:
      - bug
    acceptance_criteria:
      - >-
        MEASURED, not inferred. Session transcripts distinguish `hook_success` (what a hook printed)
        from `hook_additional_context` (what reached the model). Across them: vp-beads' "Open UPSTREAM
        tracking file" 25 emitted / 0 delivered, "Dependabot alert" 4/0, vp-knowledge's "Knowledge graph
        context" 29/0 — all bare-shaped; Anthropic's own envelope-shaped hooks 42 emitted / 21 delivered
        in the same transcripts. So the tracker prime, compaction recovery, both leak guards, the
        dormancy nudge and edit-time store validation had never reached the model in any released version
      - >-
        MECHANISM: bare JSON falls between the two documented paths. The docs say "any NON-JSON text
        written to stdout is added as context", so raw text is injected — but bare JSON is valid JSON,
        takes the JSON branch, is parsed as a hook payload, and an unrecognised top-level key is
        discarded. Exit stays 0 and nothing reports the loss
      - >-
        DONE — all three emit sites wrapped. session-start.sh's two now route through a single
        `emit_context`; post-tasks-validate.sh emits hookEventName "PostToolUse" (no fallback exists
        there at all — plain stdout on PostToolUse is debug-log only)
      - >-
        DONE — check-hooks.mjs no longer encodes the defect as its specification. Its typedef claimed
        "`additionalContext` IS the payload" and 23 sites read it, so ~15 assertions checked the contents
        of a string nobody received. Replaced with `deliveredContext`, which reads ONLY through the
        envelope and THROWS on any other shape, so a regression fails BY NAME at every call site
      - >-
        DONE — RED-proved four ways, each planted and run, not argued: (a) fixing the hooks first turned
        the un-fixed gate RED at 12 sites, which is the coupling demonstrated; (b) planting the bare form
        named it at every site; (c) planting an envelope with no hookEventName named that instead;
        (d) planting a WRONG-but-valid hookEventName failed exactly 1 test of 38 — proof the other 37
        could not see it, which is why the event-name assertions were added
      - >-
        DONE — validate-plugin.mjs's prompt-hook warning was itself dispensing the defect: it told plugin
        authors to "use type: command with additionalContext". Now names the full envelope
      - >-
        DONE — check_dependabot dropped entirely (function, call site, 3 tests, the gh stub helper).
        check_dormancy's fabricated positive fixed: `git rev-list ... || echo "0"` turned a FAILED
        measurement into the strongest possible evidence for the claim it failed to support, so the nudge
        fired on every repo with no commits and outside git entirely. An unmeasurable repo is now silent
      - >-
        The collector had exactly ONE assertion and it asserted the fabricated positive — the combined
        test's own fixture read "0 commits → dormant (rev-list fails, falls back to 0)". Two focused tests
        added, including the unmeasurable-is-not-dormant direction, and the fixture now backdates a real
        commit so it tests a genuinely dormant repo
      - >-
        NOT A ROW HERE: vp-knowledge has the identical bug (29 emitted / 0 delivered). It is a separate
        repo — UPSTREAM entry plus a handoff line, same rule that keeps drt out of our hands
      - 'STILL OPEN: the delivery itself is unproven until vp-beads-hkp runs the loader probe. Every measurement above was of the CACHED 0.18.0 hook, not the working tree'
    description: >-
      The finding that reordered the whole merge sequence. Found while re-checking a DIFFERENT claim
      (vp-beads-mpu's "no skills manifest field"), which was itself false. Gates vp-beads-sss and the
      root retirement: sharding an unverified emitter multiplies it by four.
    updated: '2026-08-05'

  - id: vp-beads-hkp
    title: 'Prove hook delivery — PASSED, and the probe is far simpler than planned'
    status: completed
    type: task
    priority: high
    parent: vp-beads-dis
    deps:
      - vp-beads-hkx
    labels:
      - chore
    acceptance_criteria:
      - >-
        PASSED 2026-08-05. The envelope DELIVERS. `post-tasks-validate.sh`'s payload arrived as
        `PostToolUse:Write hook additional context`, and the transcript confirms it independently:
        `hook_additional_context` went 3 → 4 with the vp-beads marker at 1 delivered, alongside the
        envelope-shaped Anthropic control. So the envelope is not merely NECESSARY (which the 42/21
        control already showed) but SUFFICIENT
      - >-
        THE PROBE IS MUCH CHEAPER THAN THIS ROW ORIGINALLY SPECIFIED, and the saving is worth keeping.
        Planned: disable the installed plugin, symlink the repo into `~/.claude/skills/` for
        `@skills-dir` in-place discovery, restart the session, grep the transcript, undo all of it.
        Actual: register the working-tree hook in the gitignored `.claude/settings.local.json`, make one
        real `Write` to a throwaway `.diarie/tasks/` store, read the delivered text inline
      - >-
        THE FACT THAT COLLAPSES THE PROCEDURE: hooks are NOT snapshotted at session start. A hook added
        to `.claude/settings.local.json` mid-session fires on the very next matching tool call. The
        restart-and-archaeology dance was built on the opposite assumption, which was never measured
      - >-
        EXPERIMENTAL HYGIENE THAT MADE THE RESULT READABLE: run the hook standalone FIRST and confirm it
        SPEAKS, before testing whether it is DELIVERED. Otherwise silence has two explanations and the
        probe cannot distinguish them. Point it at a THROWAWAY store rather than this repo's, so a
        deliberately-invalid fixture never touches the real one — the hook derives its project root from
        the edited file's path, so this costs nothing
      - >-
        SHARPER THAN THE ORIGINAL FINDING: the installed 0.18.0 cache contains no `post-tasks-validate.sh`
        AT ALL (`hooks.json`, `post-bm-failure-classify.sh`, `post-file-edit.sh`, `session-start.sh` only).
        So edit-time store validation was not "delivered but discarded" for released users — it was never
        shipped. The shape defect bit only those running from source
      - >-
        CONSEQUENCE FOR vp-beads-sss: the "if it still drops, do not shard" stop-check is CLEARED. The
        shard is now gated only on its real dependency, backlog/vp-beads-vgp
      - >-
        NOT PROVEN HERE, deliberately: whether the LOADER registers manifest-declared skills. That was
        this row's second yield under the `@skills-dir` method and does not come free with the cheap
        probe. It belongs to whoever needs it (vp-beads-rrp / the W4 bridge branch), and
        `claude plugin validate` does NOT answer it — validate is not the loader
    description: >-
      The verification half of vp-beads-hkx. Split out on the assumption it needed a session restart;
      it did not. Recorded in full because the cheap method is reusable for every future hook change.
    updated: '2026-08-05'

