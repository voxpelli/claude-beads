  - id: vp-beads-rrp
    title: 'Retire the root plugin: manifest becomes a marketplace'
    status: pending
    type: task
    priority: medium
    parent: vp-beads-dis
    deps:
      - vp-beads-sss
    labels:
      - chore
    acceptance_criteria:
      - >-
        `.claude-plugin/plugin.json` → `.claude-plugin/marketplace.json`. The root stops being a thing you
        install and becomes the list of things you install. NO self-entry — there is no root plugin left
      - >-
        MEASURED against `ast-grep/agent-skill`, which is exactly this topology: root marketplace.json,
        plugin in a subdirectory with its own plugin.json, skills at `<plugin>/skills/<name>/SKILL.md` —
        the DEFAULT scan, so no `skills` manifest field is needed anywhere. Its entry uses a plain
        relative `"source": "./ast-grep"`, so `metadata.pluginRoot` is a convenience, not a requirement
      - >-
        Do NOT duplicate `version` into the entries the way that exemplar does — `plugin.json` wins
        silently, so a stale entry version misleads without failing
      - >-
        Deleting the root manifest must FAIL CLEANLY, not crash: validate-plugin.mjs's root-manifest
        readJson is unguarded while its marketplace and hooks reads are existsSync-guarded, so removing it
        throws ENOENT with a stack trace and no summary. Make "no root plugin" a declared state
      - >-
        `skills/retrospective/` stops shipping when the manifest goes. The directory stays until
        vp-beads-drt; record it in the CHANGELOG as a real removal, not a footnote
      - >-
        Do NOT add `deps: [vp-beads-sss]`-style cycles: sss's own revival trigger names "Phase 2 has
        landed" and this retirement is a PRECONDITION of Phase 2. The dep above is the shard only
    description: >-
      Merges what an earlier draft split across two ideas — the root ceasing to be a plugin and the
      marketplace appearing are the same change seen twice.
    updated: '2026-08-05'

