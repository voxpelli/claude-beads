    description: >-
      Deferred recommendation from the v0.17.0 post-review (big-picture architect). session-start.sh
      is now ~245 lines with two top-level branches (compact vs startup) and ~6 concerns
      (sensitive-file, private-overlay-tracked, dormancy, Dependabot, trend-review,
      compaction-recovery+capture). The architect: do NOT split into multiple files (Claude Code
      fires a single session-start.sh; a dir adds dispatch complexity for no benefit at this size) —
      instead extract each concern into a named function (check_sensitive_files,
      check_private_overlays, check_dormancy, check_dependabot, check_trend_review,
      emit_compact_recovery) called sequentially, so each is testable in isolation and the structure
      is self-documenting. Pure refactor, no behavior change. Defer to a chore sprint.
