      non-empty `new_fields` array. Note the *opposite* signal does exist and is mildly
      interesting — the type is OVER-specified (18 dropped_fields, several at 0% usage, plus 8
      cardinality mismatches). That is a different, low-value task, and nobody has asked for it.


