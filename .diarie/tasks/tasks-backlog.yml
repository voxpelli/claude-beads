      - "DECIDE, do not drift: either lint them (fix 172 warnings — mostly table-cell-padding in the .diarie decision docs) or keep the exclusion DELIBERATELY and say why in the script. What is not acceptable is a gate that reports success over 21 files nobody chose to exclude"
      - "The general property worth enforcing is NOT 'no tracked file matches .gitignore' (vp-beads-tig) but 'no tracked file is invisible to the gates'. Those are different sets, and the second one is the one that keeps biting"
    description: >-
      The same bug class as the `AGENT-*.md` hole fixed in d2f57d4, at 21x the scale, through a
      different door — and the guard written for that hole cannot see this one. A gate, running,
      reporting success, inspecting nothing.
      RESOLVED (ownership, 2026-07-22, user): keep `.diarie/` EXCLUDED from vp-beads' check:md.
      `RESEARCH-*.md` stays excluded as vp-beads' own frozen provenance artifacts. So the DECIDE
      resolves to "keep excluded, DELIBERATELY" — package.json patterns UNCHANGED. Warning distribution
      MEASURED 2026-07-22: all 172 are in FROZEN files (`.diarie/_archive/` 23 + `RESEARCH-*` ~150);
      the 4 LIVE decision docs carry 0.
      CORRECTION (2026-07-22, audit — the first write of this note was WRONG): the resolution is sound
      but its stated REASON was not. It claimed decision-doc content "belongs to `diarie validate`".
      MEASURED FALSE from diarie's own source — `node_modules/diarie/lib/store.js` globs only
      `TASKS_FILE_RE = /^tasks-.+\.ya?ml$/` with the comment "Decisions and docs are deliberately
      outside it"; NO code path in diarie opens `.diarie/decisions/`. The real coverage map, each leg
      empirically proven by planting a defect: decision-doc BODIES are gated — by this repo's own
      `check:md-decisions` (`remark '.diarie/decisions/*.md' --frail`, added 2026-07-18 in 8d9e470,
      confirmed wired into `run-p check:*` by watching `npm run check` fail with
      `ERROR: "check:md-decisions" exited with 1`); decision-doc FRONTMATTER is gated by NOTHING (the
      genuine gap → upstream `diarie-dlm`); `.diarie/tasks/*.yml` IS gated by `diarie validate`
      (exit 2 on a bogus status / dangling dep); `.diarie/_archive/**` is ungated by every root check
      (deliberate — frozen). So "unlinted" was true only of FRONTMATTER, never of bodies.
      A RED-proof (planted broken-link warning in `.diarie/decisions/`, `remark-validate-links`) confirmed
      the exclusion mechanism: `remark .` DOES reach `.diarie/` (not dot-dir-skipped — an early wrong
      hypothesis), so `--ignore-pattern .diarie/` is load-bearing, and narrowing WOULD pull decisions into
      remark — but that is the wrong owner. FOLLOW-UPS: (a) document the deliberate exclusion in CLAUDE.md
      Validation → fold into dcr (γ); (b) diarie-side gap: `diarie validate` should cover `.diarie/decisions/`
      (frontmatter + prose) — external, belongs in voxpelli/diarie's backlog (see handoffs/). Left `pending`
      until (a)+(b) are routed.
    updated: '2026-07-22'
