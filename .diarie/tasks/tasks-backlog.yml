  - id: vp-beads-yjp
    title: bd close persistence broken when .beads/ is gitignored
    status: pending
    type: task
    priority: medium
    acceptance_criteria:
      - >-
        Root cause of `bd close` persistence failure identified (beads upstream or vp-beads
        workaround)
      - Workaround documented or upstream issue filed with beads
      - False-positive `IN_PROGRESS` entries in `bd stats` eliminated
    description: |-
      Regular `bd close <id>` reports `✓ Closed` success but state reverts to
      `IN_PROGRESS` on next `bd show`/`bd stats`/`bd blocked`. Auto-export step emits
      warning `Warning: auto-export: git add failed: ... .beads ignored by gitignore`,
      which seems to roll back the JSONL write. `bd close --force` succeeds in-memory
      and the success message persists in that invocation, but the close ALSO doesn't
      reliably persist across subsequent `bd` invocations in this configuration.
      Reproduced 2x on Sprint 24 (vp-claude-lgb + vp-claude-cuz). Both issues continue
      to appear in `bd blocked` and `bd stats` as `IN_PROGRESS` despite multiple
      `--force` closes. This is a data-integrity issue: closed work appears unfinished,
      leading to false-positive blocked-dependency reports and incorrect sprint-tracking
      metrics.
      Severity: degraded · Ownership: upstream (beads) · Workaround: partial — `--force`
      succeeds in the current shell invocation but doesn't persist; verify every close
      with `bd show <id>` and accept some closes won't stick. Tracked locally as bd
      `vp-claude-syw`.

      Sibling vp-knowledge tracks this against us in their UPSTREAM-vp-beads.md.
      Source section: Bugs.
    updated: '2026-06-02'
