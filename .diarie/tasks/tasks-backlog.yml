  - id: vp-beads-8d5
    title: '[swarm-wave] Add Ralph Wiggum Technique references to existing skills'
    status: pending
    type: task
    priority: backlog
    acceptance_criteria:
      - Add a "Ralph Loop vs Research Wave" section to  with a decision matrix
      - Add a Ralph-loop anti-pattern to  (e.g., "Wiring Ralph loop into wave execution")
      - >-
        Add a one-paragraph caution in  workflow 5 (Research wave) guidelines clarifying Ralph loops
        are not research agents
      - >-
        Add a "naive-first" heuristic step to  workflow 4 (Investigate topic as spike) — suggest
        Ralph loop for narrow, mechanical, validation-backpressure-friendly topics
      - Run
    description: >-
      ## Problem


      The vp-beads plugin documents multi-agent orchestration (swarm-wave) thoroughly, but says
      nothing about single-agent autonomous loops. Users may assume swarm-wave is the only valid
      pattern, or worse, try to wire a Ralph loop into wave execution.


      ## Why it matters


      The Ralph Wiggum Technique (Geoffrey Huntley, 2025) is a documented single-agent autonomous
      loop with real results (CURSED language, test refactoring, overnight contract delivery). It is
      complementary to swarm-wave, not a competitor. Users will encounter it in the wild; vp-beads
      should acknowledge it and draw a safety boundary.


      ## Notes


      No new files. No new skills. No runtime code. Pure documentation references in existing skill
      prose. See research findings in conversation context for full mechanics, decision matrix, and
      safety comparison.
    updated: '2026-06-02'
  - id: vp-beads-ayn
    title: >-
      feat(plugin): single-source-of-truth for KNOWN_RELATIONSHIPS vocabulary across validator +
      synergy-tracker docs
    status: pending
    type: task
    priority: low
    labels:
      - feature
    description: >-
      Sprint 13 Commit 3 + Commit 4 brought the validator's KNOWN_RELATIONSHIPS set and
      synergy-tracker references/synergy-entry-format.md 'Relationship vocabulary' into agreement
      (six values: sibling-plugin, shared-tooling, fork, consumer, coordinated-release, dependency).
      However the two declarations live in independent files with no automated cross-check — a
      future edit to one without the other would silently re-introduce the docs-vs-code drift that
      vp-beads-bxc tracked.


      Two architectural options to consider:


      A. **Reference doc as source-of-truth.** validate-plugin.mjs reads the canonical six values
      from a structured location in references/synergy-entry-format.md (e.g., a fenced YAML block)
      at validation time. Single edit point.


      B. **Shared JSON config.** Both validate-plugin.mjs and the reference doc render from a shared
      .claude-plugin/relationship-vocabulary.json. Two consumers, one declaration.


      C. **Validator-as-source-of-truth + doc-generator.** A small script generates the markdown
      table from the validator's set; CI fails if hand-edits don't match the generator output.


      Source: post-Sprint-13 review (R3-F3, confidence 85, design-level).
    updated: '2026-05-08'
