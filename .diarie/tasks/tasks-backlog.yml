tasks:
  - id: vp-beads-epc
    title: ready-walker surfaces an EPIC (a parent with open children) as ready
    status: completed
    type: task
    priority: medium
    labels:
      - bug
    acceptance_criteria:
      - a task with at least one non-completed child is excluded from ready (you work the children, not the container)
      - an `epic`-labelled task is excluded from ready regardless of children
      - a childless task is unaffected; add a fixture covering parent-with-open-children in check-ready-walker.mjs
      - DESIGN-diarie-vs-beads.md "where beads is ahead" row updated or removed once fixed
      - "the two predicates (structural: open children / declarative: `epic` label) are asserted INDEPENDENTLY — vp-beads-l9i satisfies both, so a structural-only fix passes an l9i-based test unimplemented"
      - "the id-space is coherent: loadTasks globalizes `parent` like `deps`, asserted through a real store on disk (a unit test writes both ids by hand and structurally cannot catch it)"
    description: >-
      Found 2026-07-11 by dogfooding the new SessionStart tracker prime: it led with
      "next ready: vp-beads-l9i (high)" — l9i is the *migration epic*, a container with
      three open children (iai, l2s, pku). An epic is not workable; its children are.


      Root cause is the 4-type collapse (decision vp-beads-etm). bd had a separate `epic`
      TYPE, so its ready-walk could exclude epics structurally. We made epic = `task` +
      `parent:` (+ an `epic` label), which is the right model — but `computeReady` only
      gates on type, so a parent task now computes as ready like any other.


      This is the same CLASS of bug as the type-blindness we fixed in ec73dd9 and that we
      criticize bd for in DESIGN-diarie-vs-beads.md: a non-workable item offered as work.
      Recorded there under "where beads is still ahead" until this is fixed — the doc must
      not claim a property the tool does not have.


      FIXED 2026-07-11. The fix was nearly a no-op that would have gone green: `loadTasks`
      globalized `id` and `deps` into the `slug/id` namespace but handed `parent` back RAW,
      so `parent` could never equal any `id`. Indexing children by parent would have found
      ZERO children for every epic, excluded nothing, and passed the suite. Root cause was
      the id rule existing TWICE — `store.nsId` and a private `validate.glob` — with one
      copy incomplete; it now lives once, in schema.js. A parent with open children is
      blocked BY those children (own `children:` field — a dep must finish first, a child
      is contained); an `epic`-labelled task with no open children surfaces in
      needsAttention ("close it or add children") rather than vanishing. Verified by
      MUTATION: reverting the namespacing turns 4 assertions red. The live store went
      24/17-ready/0-blocked → 24/16-ready/1-blocked, with l9i's three children still ready.
    updated: '2026-07-11'
