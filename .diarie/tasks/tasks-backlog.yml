  - id: vp-beads-bsv
    title: 'basic-memory: sync duplicates observation rows — 19% of the index is duplicates, files are clean'
    status: pending
    type: task
    priority: high
    labels:
      - bug
      - upstream
    acceptance_criteria:
      - a paste-ready GitHub issue (title, body, SQL reproduction, graph-wide evidence) is DRAFTED into UPSTREAM-basic-memory.md
      - nothing is filed on GitHub without an explicit in-the-moment go-ahead
      - the friction is promoted to a "## Upstream Friction" entry on the brew-basic-memory entity note in BM
      - 'the write-up states the CORRECTED finding: the tool reports the index faithfully; the INDEX is corrupt, not the tool'
      - the local index is repaired (bm reset --reindex) only with explicit user consent — it drops and rebuilds their graph DB
    description: >-
      Basic Memory's SQLite index holds every observation of some entities TWO or THREE times. The
      markdown files on disk are CLEAN. This is index corruption, not note corruption.


      Measured, not inferred: the file `npm-markdown-or-chalk.md` has 23 observation lines, 23
      distinct; the `observation` table has 48 rows, 24 distinct for that entity. Graph-wide:
      **26,832 observation rows vs 21,740 distinct (entity, content) pairs → 5,092 duplicate rows,
      across 241 of 1,654 entities (14.6%).** Factor is almost always exactly 2x, sometimes 3x.


      THE MECHANISM IS NOT ESTABLISHED — and the write-up must not pretend it is. The duplicates
      are HISTORICAL: the current write path tests clean. Three notes were edited and re-measured
      (a find_replace deleting observations, a relation rename, a whole-section insert) and NONE
      duplicated anything. An early draft of this row asserted "consistent with a re-sync inserting
      rows without deleting the old ones" — that was the same unmeasured-inference reflex that
      produced the original wrong finding, caught this time before it shipped.


      What IS reproducible, and is therefore what the issue leads with: `bm status` says "No
      changes" and `bm doctor` passes ON THIS INDEX. The health vocabulary cannot see a 19%
      duplicate rate. That detection gap is the actionable defect.


      THE CORRECTION THAT MATTERS, and the reason this row was rewritten: the original finding
      claimed `schema_validate` "double-counts and invents a phantom `note` category". BOTH HALVES
      WERE WRONG, and wrong in the direction that blamed the tool instead of the data.
      `schema_validate` reports the index FAITHFULLY — the observation really is in the database
      twice. The `note` category is REAL: BM parses any `- ` bullet as an observation and defaults
      an uncategorized one to `note`; the culprit bullet lives in the `## Upstream Friction`
      section that OUR OWN /upstream-tracker writes. And `schema_diff` is unaffected — its
      numerators are note-presence counts, several are ODD (31, 19, 23, 11 — a doubled integer
      cannot be odd), and its denominator matches `bm project info` exactly.


      So the claim "every schema-evolution decision is being made on inflated numbers" is REFUTED.
      That was a plausible, confident inference that no one had measured. The measurement took one
      SQL query.
    updated: '2026-07-11'
