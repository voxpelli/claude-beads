      - >-
        PROVEN: the literal template line with a `-` bullet under this repo's own config exits 1
        ("Unexpected unordered list marker `-`, expected `*`"); with `*` it exits 0. An agent following
        log.md verbatim writes an entry that reddens `npm run check`.
      - >-
        DONE: the 8 fenced bullets flipped to `*` in log.md and synergy-entry-format.md, each file gaining
        a note on WHY the marker is hand-maintained (a fence is unreachable by `remark --output`).
      - >-
        SCOPE CORRECTED ON INSPECTION, in BOTH directions — the original AC was wrong twice, so verify
        before trusting it. (a) The "lower-risk siblings" must NOT follow: synergy-bm-format.md and
        basic-memory-friction-format.md are templates for BASIC MEMORY note content, and the BM graph's
        own convention is `-` (confirmed by reading live notes). Flipping them would write the wrong
        marker into the graph. They keep `-`, now stated explicitly in synergy-entry-format.md.
