  - id: vp-beads-jyr
    title: Jyri Engeström — a duplicate edge on the Jaiku note that silently resolved to the WRONG entity
    status: completed
    type: task
    priority: low
    labels:
      - chore
    acceptance_criteria:
      - the Jaiku note carries ONE `created_by` relation, and it resolves to the person
      - the unaccented duplicate (Engestrom) is gone
      - no person note had to be created — it already existed
    description: >-
      Closed. The reported defect was "two spellings, NEITHER resolving, person note missing".
      All three halves were wrong, and the truth was worse.


      The person note **already existed** (`Jyri Engeström - Social Objects Theorist and Jaiku
      Co-founder`), so no /people-intel research was needed. The accented edge **resolved
      correctly**. And the unaccented duplicate did not dangle — it **silently fuzzy-resolved to
      the WRONG ENTITY**, `Social Objects Theory - Object-Centered Sociality`. The graph was
      asserting that Jaiku was *created by a theory*.


      That is the whole lesson, and it is this sprint's lesson again in a different substrate: a
      DANGLING link is visible and harmless; a link that resolves CONFIDENTLY TO THE WRONG THING is
      neither. BM resolves wiki-links by exact title match and falls back to fuzzy search — so a
      near-miss title does not fail, it lands somewhere plausible. Fixed by deleting the duplicate
      line; one correct edge remains.
    updated: '2026-07-11'
  - id: vp-beads-bsv
    title: 'basic-memory: sync duplicates observation rows — 19% of the index is duplicates, files are clean'
    status: cancelled
    type: task
    priority: high
    labels:
      - bug
      - upstream
    acceptance_criteria:
      - 'CANCELLED — upstream BM bug, not vp-beads work. The three actionable items were already DONE
        (drafted into UPSTREAM-basic-memory.md, promoted to BM friction entry, corrected finding).
        The two OPEN items: filing upstream is DEFERRED (needs user go-ahead 2026-07-11); repairing
        the local index was DECLINED (kept as live evidence). UPSTREAM-basic-memory.md holds the
        paste-ready issue draft if the go-ahead ever comes.'
    description: >-
      Basic Memory's SQLite index holds every observation of some entities TWO or THREE times. The
      markdown files on disk are CLEAN. This is index corruption, not note corruption.
      Cancelled as upstream BM work, not vp-beads territory.


      Measured, not inferred: the file `npm-markdown-or-chalk.md` has 23 observation lines, 23
      distinct; the `observation` table has 48 rows, 24 distinct for that entity. Graph-wide:
      **26,832 observation rows vs 21,740 distinct (entity, content) pairs → 5,092 duplicate rows,
      across 241 of 1,654 entities (14.6%).** Factor is almost always exactly 2x, sometimes 3x.


      THE MECHANISM IS NOT ESTABLISHED — and the write-up must not pretend it is. The duplicates
      are HISTORICAL: the current write path tests clean. Three notes were edited and re-measured
      (a find_replace deleting observations, a relation rename, a whole-section insert) and NONE
      duplicated anything. An early draft of this row asserted "consistent with a re-sync inserting
      rows without deleting the old ones" — that was the same unmeasured-inference reflex that
      produced the original wrong finding, caught this time before it shipped.


      What IS reproducible, and is therefore what the issue leads with: `bm status` says "No
      changes" and `bm doctor` passes ON THIS INDEX. The health vocabulary cannot see a 19%
      duplicate rate. That detection gap is the actionable defect.


      TWO DELIBERATE DEFERRALS (2026-07-11, user decisions — not oversights):

      1. The index is NOT repaired. `bm reset --reindex` would rebuild it clean from the files,
      but the corrupt state is being KEPT as live evidence for the upstream report. Consequence,
      stated so nobody is surprised: any tool reading observation counts back through the index —
      `schema_validate` above all — is reading doubled numbers for 241 entities RIGHT NOW. Recount
      against `read_note` before acting on any frequency-derived conclusion.

      2. The issue is NOT filed. It is drafted and waiting. Filing is outward-facing and needs a
      fresh, in-the-moment go-ahead.


      This row stays OPEN until one of those two happens.


      THE CORRECTION THAT MATTERS, and the reason this row was rewritten: the original finding
      claimed `schema_validate` "double-counts and invents a phantom `note` category". BOTH HALVES
      WERE WRONG, and wrong in the direction that blamed the tool instead of the data.
      `schema_validate` reports the index FAITHFULLY — the observation really is in the database
      twice. The `note` category is REAL: BM parses any `- ` bullet as an observation and defaults
      an uncategorized one to `note`; the culprit bullet lives in the `## Upstream Friction`
      section that OUR OWN /upstream-tracker writes. And `schema_diff` is unaffected — its
      numerators are note-presence counts, several are ODD (31, 19, 23, 11 — a doubled integer
      cannot be odd), and its denominator matches `bm project info` exactly.


      So the claim "every schema-evolution decision is being made on inflated numbers" is REFUTED.
      That was a plausible, confident inference that no one had measured. The measurement took one
      SQL query.
