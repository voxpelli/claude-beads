  - id: vp-beads-mjl
    title: 'upstream-tracker: clarify redirect rule for sibling projects with shipped skill code'
    status: completed
    agent: claude
    type: task
    priority: medium
    acceptance_criteria:
      - >-
        Folded into the ledger merge (`vp-beads-ldg`): the ledger `log` mode's object-routing
        prose distinguishes a cross-project PATTERN (→ log sibling) from a CONCRETE code request
        against a sibling's shipped artifact (→ log upstream, `UPSTREAM-<sibling-name>.md`) — the
        vp-plugins sibling-that-is-also-an-upstream-source case. The merge itself dissolves the
        old cross-skill redirect into an explicit object-routing decision within one `log` mode.
    description: >-
      Sibling friction filed by vp-knowledge in their UPSTREAM-vp-beads.md (2026-05-04, Ownership:
      upstream = us). Surfaced via /sibling-sync Sprint 14+.


      Workflow 1 (Log a new entry) step 1 currently says "If the observation is about a sibling
      project rather than an upstream package or tool, redirect to /synergy-tracker — this skill
      only tracks upstream dependency friction, not cross-project patterns." This conflates two
      distinct cases. When a sibling project is also an upstream skill/hook/agent source (the
      vp-plugins marketplace pattern: vp-beads, vp-knowledge, vp-git all consume each others
      artifacts), filing concrete skill improvements (feature requests, bugs in skill prose,
      contribution opportunities to extract shared logic) IS upstream-tracker work — there IS a real
      upstream artifact to file against. synergy-tracker is for patterns and divergences, not
      concrete code requests.


      Concrete change: rewrite the redirect rule to distinguish patterns from filable artifacts: "If
      the observation is a cross-project pattern (shared approach, divergence, extraction candidate,
      capability gap) between sibling projects, redirect to /synergy-tracker. Sibling projects that
      ship upstream artifacts (skills, hooks, agents) can still receive upstream-tracker entries for
      concrete bug reports, feature requests, or contribution opportunities against those
      artifacts."


      vp-knowledge Sprint 19 logged 4 such entries (3 synergy-tracker improvements + retrospective
      npm run check fallback) that would have been miscategorized under the current rule. The
      carve-out is exercised in practice (UPSTREAM-vp-knowledge.md and UPSTREAM-vp-beads.md both
      exist) but undocumented.


      Source: vp-knowledge/UPSTREAM-vp-beads.md Feature Requests section, 2026-05-04. Section:
      Feature Requests.
    updated: '2026-05-08'
