    description: >-
      Closed. The reported defect was "two spellings, NEITHER resolving, person note missing".
      All three halves were wrong, and the truth was worse.


      The person note **already existed** (`Jyri Engeström - Social Objects Theorist and Jaiku
      Co-founder`), so no /people-intel research was needed. The accented edge **resolved
      correctly**. And the unaccented duplicate did not dangle — it **silently fuzzy-resolved to
      the WRONG ENTITY**, `Social Objects Theory - Object-Centered Sociality`. The graph was
      asserting that Jaiku was *created by a theory*.


      That is the whole lesson, and it is this sprint's lesson again in a different substrate: a
      DANGLING link is visible and harmless; a link that resolves CONFIDENTLY TO THE WRONG THING is
      neither. BM resolves wiki-links by exact title match and falls back to fuzzy search — so a
      near-miss title does not fail, it lands somewhere plausible. Fixed by deleting the duplicate
      line; one correct edge remains.
