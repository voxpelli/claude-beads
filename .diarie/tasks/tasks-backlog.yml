  - id: vp-beads-yjp
    title: bd close persistence broken when .beads/ is gitignored
    status: pending
    type: task
    priority: medium
    acceptance_criteria:
      - >-
        Root cause of `bd close` persistence failure identified (beads upstream or vp-beads
        workaround)
      - Workaround documented or upstream issue filed with beads
      - False-positive `IN_PROGRESS` entries in `bd stats` eliminated
    description: |-
      Regular `bd close <id>` reports `✓ Closed` success but state reverts to
      `IN_PROGRESS` on next `bd show`/`bd stats`/`bd blocked`. Auto-export step emits
      warning `Warning: auto-export: git add failed: ... .beads ignored by gitignore`,
      which seems to roll back the JSONL write. `bd close --force` succeeds in-memory
      and the success message persists in that invocation, but the close ALSO doesn't
      reliably persist across subsequent `bd` invocations in this configuration.
      Reproduced 2x on Sprint 24 (vp-claude-lgb + vp-claude-cuz). Both issues continue
      to appear in `bd blocked` and `bd stats` as `IN_PROGRESS` despite multiple
      `--force` closes. This is a data-integrity issue: closed work appears unfinished,
      leading to false-positive blocked-dependency reports and incorrect sprint-tracking
      metrics.
      Severity: degraded · Ownership: upstream (beads) · Workaround: partial — `--force`
      succeeds in the current shell invocation but doesn't persist; verify every close
      with `bd show <id>` and accept some closes won't stick. Tracked locally as bd
      `vp-claude-syw`.

      Sibling vp-knowledge tracks this against us in their UPSTREAM-vp-beads.md.
      Source section: Bugs.
    updated: '2026-06-02'

  - id: vp-beads-vcb
    title: 'check:prose-commands — verify every command the plugin tells agents to run actually exists'
    status: completed
    type: task
    priority: high
    labels:
      - feature
    acceptance_criteria:
      - "extracts every `diarie <sub> [--flags]` and `node <path>` invocation from hooks/, skills/, agents/, CLAUDE.md and README.md — the measured corpus is 64 distinct invocations"
      - "resolves each against the real CLI: unknown subcommand, unknown flag, or a flag on the wrong subcommand FAILS the check"
      - "a named file path that does not exist FAILS the check"
      - "THE ORACLE IS THE REAL BINARY: spawn `diarie <sub> --help` and parse the flag table it prints. peowly GENERATES that help text from the same `flags` object it parses with, so the two cannot drift. Do NOT hardcode a flag table — a second model of the CLI is this project's signature failure installed inside the check meant to prevent it. DEPENDS ON vp-beads-cli: today `migrate --help` exits 1, so the oracle is not yet uniform"
      - "EXCEPT `migrate`, whose USAGE string is HAND-WRITTEN and CAN drift from the parseArgs config inside runMigration (it does not use peowly). Add a diarie-side test asserting USAGE lists exactly the flags runMigration accepts"
      - "MUST distinguish an IMPERATIVE from a MENTION. `node scripts/ready-walker.mjs` in a session-start heredoc is a command to run (BUG). `git grep ready-walker` in CLAUDE.md's own doc-grep lesson, and the /ready-walker/ regex in audit-silent-skips.mjs that DETECTS the retired token, are deliberate historical references (NOT bugs). A naive grep flags CLAUDE.md's lesson about the fossil as the fossil"
      - "scans PROSE PAYLOADS inside hooks (heredocs), not only executable command lines — the ready-walker fossil lives in a heredoc and a command-line-only extractor misses the highest-traffic surface in the repo"
      - "added to `npm run check`, and it goes RED against the live fossils BEFORE they are fixed: README.md:69 (`diarie ready --stats` — that flag does not exist), hooks/session-start.sh:257 (`node scripts/ready-walker.mjs` — file deleted), skills/retrospective/SKILL.md:279,281 (`ready-walker --stale` / `--blocked`). A check that has never been red has never been tested"
    description: >-
      Sprint 16 shipped a dead command into EVERY session — `hooks/session-start.sh` told each
      one to "Find work with `node scripts/ready-walker.mjs`", a file deleted two commits
      earlier. The commit that swept 11 instruction files named the exact root cause —
      "nothing verifies that the commands this plugin tells agents to run actually exist" —
      and then proved it by missing the highest-traffic surface in the repo.


      `npm run check` was green through all of it. It checks that the CODE works; nothing
      checks that the PROSE tells the truth about the code. That is the gap: this plugin is
      mostly prose, and its prose is executable instructions.


      Related fossils the same check would have caught: `diarie ready --stale` (a `stats`
      flag — exits 1 on `ready`), and `/retrospective`'s task template emitting `priority: 2`
      + a string `acceptance_criteria`, both HARD ERRORS in the gate the next line tells you
      to run.
    updated: '2026-07-11'
