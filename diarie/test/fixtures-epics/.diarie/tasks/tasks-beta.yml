# The CROSS-FILE parent case: a child in `beta` whose parent lives in `alpha`, written
# slug-qualified (`alpha/E-OPEN`) exactly as cross-file `deps` are.
#
# What this does NOT test — established by mutation, not assumed: it does not guard the
# `parent` namespacing. A qualified ref already contains a `/`, so it passes through
# `nsId` untouched and resolves fine even with the namespacing removed. The rows that
# actually catch that regression are the BARE same-file parents in tasks-alpha.yml
# (`parent: P-OPEN` must become `alpha/P-OPEN` to match any id) — which is the exact
# shape the live store uses, and the exact shape that broke.
#
# What it DOES test: that qualifying a parent across files works at all, and that nsId
# is idempotent on an already-qualified ref rather than double-prefixing it to
# `beta/alpha/E-OPEN`.
meta:
  slug: beta
  title: Container fixture — beta (cross-file parent)
tasks:
  - id: C-CROSS
    title: Open child of alpha's epic, filed in another file
    type: task
    status: pending
    priority: medium
    parent: alpha/E-OPEN
