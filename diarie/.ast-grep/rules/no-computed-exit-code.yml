id: no-computed-exit-code
language: javascript
message: >-
  An exit code must be a LITERAL, readable at the call site. `exit(code)`, `exit(TWO)`,
  `exit(ok ? 0 : 1)`, `process.exit(Number(x))` — all banned. Write the number.

  This rule exists to close the hole in its sibling, `no-unsanctioned-exit-2`. That rule reserves
  exit 2 for `ResultError` ("it ran, and the answer is no") — the one exit code this tool exists
  to make trustworthy. But ast-grep matches SYNTAX, not values, so it can only ever see the
  literal `2`. `const TWO = 2; exit(TWO)` walks straight past it, and the invariant quietly dies.

  Rather than reach for the type system to chase the value, forbid the indirection: if every exit
  argument must be a literal, then every exit-2 IS the literal 2, and the sibling rule sees all of
  them. The two rules together make exit 2 structurally unreachable outside its one sanctioned
  branch — which neither achieves alone.

  The cost is small and the benefit is not only mechanical: an exit code you have to go and look
  up is an exit code nobody checks. `exit()` with no argument is untouched (it means 0).
severity: error
rule:
  any:
    - pattern: exit($CODE)
    - pattern: process.exit($CODE)
    - pattern: process.exitCode = $CODE
constraints:
  CODE:
    not:
      all:
        # A PLAIN DECIMAL INTEGER, and nothing else. `kind: number` alone was not enough: tree-sitter
        # calls `0x2` and `2.0` numbers too, and both evade the literal `2` its sibling matches while
        # exiting 2 all the same. The regex is what makes "the number is right there" actually true.
        - kind: number
        - regex: '^\d+$'
