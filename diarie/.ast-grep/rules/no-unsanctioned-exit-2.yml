id: no-unsanctioned-exit-2
language: javascript
message: >-
  Exit code 2 is SPOKEN FOR: it means `ResultError` — "it ran, and the answer is no" (an invalid
  store, a cyclic backlog, `--strict`). It is the one exit code this tool exists to make
  trustworthy, and a second meaning destroys it: a CI job branching on 2 could no longer tell a
  dependency cycle from a typo.

  Call `exitResultError()` from `lib/utils/exit.js` — the sole sanctioned site, and this rule's only
  exemption. Everything a user can get WRONG is an `InputError`: exit 1, with a machine-readable
  code (`ENOSTORE` no store, `EUSAGE` typed it wrong, `EEXIST` store already there). If you need a
  new failure mode, give it an InputError code. Do not reach for exit 2.

  THE COLLISION IS EASY AND SILENT. `peowly`'s `showHelp()` defaults to `process.exit(2)` on
  purpose — "Default to code 2 for incorrect usage" (peowly#47) — so a bare `diarie` exited 2 for
  months, meaning "you forgot the subcommand" in the code reserved for "your backlog is broken".

  WHY THERE IS NO CLEVER EXEMPTION HERE. This rule first tried to exempt `exit(2)` when it sat
  inside an `if (err instanceof ResultError)`. Two reviewers broke that in three ways within
  minutes: an `exit(2)` in the ELSE arm, one in a closure nested inside the sanctioned branch, and
  one in an `if` merely wrapped by it — all silently exempted, because `inside`+`has` with
  `stopBy: end` matches any ancestor whose whole subtree merely MENTIONS the condition. The
  exemption was harder to reason about than the invariant it protected. So it is gone: exit 2 is
  banned outright, and the single legal call hides behind a NAME instead of behind a rule.

  Its sibling `no-computed-exit-code` closes the other half — every exit code must be a literal, so
  `const TWO = 2; exit(TWO)` cannot slip past this syntax match. Neither rule is sufficient alone.
  Delete either and the other stops holding.
severity: error
# No `files:` — bare `ast-grep scan` walks the whole package from sgconfig.yml, so scoping by
# glob would only create a way for this rule to point at nothing. `ignores:` is the one real
# exemption, and it is a single file.
ignores:
  # The definition itself. One file, one function, one call — `git grep exitResultError` is an
  # exhaustive list of every way this process can exit 2.
  - "lib/utils/exit.js"
rule:
  any:
    - pattern: exit(2)
    - pattern: process.exit(2)
    # `process.exitCode = 2` is the idiomatic MODERN way to set a status — you reach for it
    # precisely to avoid `process.exit()` truncating a pending stdout write. So it is what a
    # careful contributor writes, and it evaded both rules until a reviewer planted it. It really
    # does exit 2 (`node -e 'process.exitCode = 2'; echo $?` → 2).
    - pattern: process.exitCode = 2
