id: no-hardcoded-tracker-dir
snapshots:
  ? |
    const p = `${root}/.diarie/tasks/tasks-x.yml`
  : labels:
    - source: '`${root}/.diarie/tasks/tasks-x.yml`'
      style: primary
      start: 10
      end: 45
  ? |
    const tasksDir = join(root, '.diarie', 'tasks')
  : labels:
    - source: '''.diarie'''
      style: primary
      start: 28
      end: 37
  ? |
    const tasksDir = join(root, 'backlog/tasks')
  : labels:
    - source: '''backlog/tasks'''
      style: primary
      start: 28
      end: 43
  ? |
    stderr.write('refusing to write under .diarie/tasks/\n')
  : labels:
    - source: '''refusing to write under .diarie/tasks/\n'''
      style: primary
      start: 13
      end: 55
