id: no-identical-test-title
valid:
  # Distinct titles among siblings — the ordinary case.
  - |
    describe('computeReady', () => {
      it('pending with no deps is ready', () => {})
      it('blocked by an open dep is not ready', () => {})
    })
  # The SAME title in a DIFFERENT sibling describe. node:test scopes titles per parent,
  # so this is legal — and `follows` only matches siblings, so it is not flagged.
  - |
    describe('computeReady', () => {
      it('is ready', () => {})
    })
    describe('computeStats', () => {
      it('is ready', () => {})
    })
  # The same title in a NESTED describe shadows rather than collides. Also legal.
  - |
    describe('outer', () => {
      it('same name', () => {})
      describe('inner', () => {
        it('same name', () => {})
      })
    })
  # A non-test call that merely takes a string first argument.
  - |
    assert.equal(nsId('T-1', 'alpha'), 'alpha/T-1')
    assert.equal(nsId('T-1', 'beta'), 'beta/T-1')
invalid:
  # Two sibling it()s with one title — node:test runs BOTH, silently.
  - |
    describe('computeReady', () => {
      it('pending with no deps is ready', () => {})
      it('pending with no deps is ready', () => {})
    })
  # Not adjacent: `stopBy: end` walks every preceding sibling, not just the last.
  - |
    describe('computeReady', () => {
      it('a', () => {})
      it('b', () => {})
      it('a', () => {})
    })
  # describe() collides the same way.
  - |
    describe('twin', () => {})
    describe('twin', () => {})
  # The test() alias, and the async form.
  - |
    test('alias', async () => {})
    test('alias', async () => {})
  # At top level, with no describe at all.
  - |
    it('top level', () => {})
    it('top level', () => {})
