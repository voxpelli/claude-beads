    parent: vp-beads-dia
    labels:
      - bug
    acceptance_criteria:
      - "`migrate --help` / `-h` prints USAGE to STDOUT and exits 0 (today: InputError, exit 1 — it conflates `you asked for help` with `you forgot the file`)"
      - "`migrate` stays NON-peowly — this is three lines in run(), NOT a four-part conversion (see decision vp-beads-sea)"
      - "bare `diarie` exits 1, not 2 — exit 2 is reserved for ResultError (`it ran, and the answer is no`)"
      - "unknown subcommand and unknown flag raise InputError (exit 1) and HONOUR --json — today both emit a raw ERR_PARSE_ARGS_UNKNOWN_OPTION / PeowlyCommandMissingError stack labelled `unexpected`, with EMPTY stdout, violating the JSON error contract cli.js documents in its own header"
      - "tests for all four (today: zero tests for unknown flag, unknown subcommand, or bare invocation)"
      - "after this, `<sub> --help` exits 0 for ALL FIVE subcommands — that uniformity is what gives vp-beads-vcb a sound oracle"
    description: >-
      Measured 2026-07-14 BEFORE touching anything: nothing in the repo branches on diarie's exit
      codes (the hooks use `|| true` and test for EMPTY OUTPUT, never a status), so the taxonomy
      could be corrected without breaking a caller. Changing an exit code is a contract change;
      the grep is what made it safe.


      SHIPPED. `--help` now exits 0 for all five subcommands (that uniformity is vp-beads-vcb's
      oracle); bare `diarie` is 1; unknown command and unknown flag are InputErrors carrying the
      new `EUSAGE` code on stdout under --json, instead of a `node:internal/util/parse_args` stack
      trace labelled "unexpected" with an EMPTY stdout. 194 assertions (+12). Each of the three
      guards was mutation-proven able to go red (1, 3 and 1 failures respectively).


      THE COLLISION, for the record: peowly's `showHelp()` defaults to `process.exit(2)` ON
      PURPOSE — "Default to code 2 for incorrect usage" (peowly#47) — and 2 was already taken here
      by ResultError. Two meanings, one code: a CI job branching on 2 could not tell a dependency
      cycle from a typo. `main.js` now intercepts the bare invocation before peowly-commands can
      exit.


      BEYOND THE ACs: the invariant is now STRUCTURAL, not advisory. The new ast-grep rule
      `no-unsanctioned-exit-2` forbids `exit(2)` / `process.exit(2)` anywhere in `diarie/lib/**` or
      `cli.js` except inside the one `if (err instanceof ResultError)` branch — proven by planting a
      violation, not by a passing snapshot. `diarie/cli.js` had to JOIN check-ast-grep.mjs's scan
      bound for the rule to fire at all; scoped outside that list it would have enforced nothing
      while reporting success. And `check-ast-grep.mjs` now asserts its scan paths EXIST, because
      `ast-grep scan` on a missing path exits 0 — the guard needed a guard.
