  - id: vp-beads-sea
    title: Adopt the peowly-commands FOUR-part command shape — setupCommand / doTheWork / formatWorkResult
    status: completed
    type: task
    priority: high
    parent: vp-beads-dia
    labels:
      - refactor
    acceptance_criteria:
      - "FOUR PARTS per command, per `peowly-commands/example/complete/commands/single/index.js` — the authoritative shape, from the library's own examples: (1) the `CliCommand` definition, whose `run()` holds NO logic; (2) `setupCommand(name, description, args, meta)` → `void | CommandContext` (the peowly parse; `void` = help was shown); (3) `doTheWork(input, context)` → `void | WorkResult` — **returns typed DATA, never prints**; (4) `formatWorkResult(workResult, context)` → `void` — the ONLY place that writes. `run()` wires them and guards each stage on the void."
      - "part (3) is the point: because `doTheWork` RETURNS a `WorkResult` instead of printing, it is unit-testable in-process — no spawn, no stdout capture. That is the seam diarie lacks, and it is why the one in-process test had to hijack `process.stdout.write` and silently broke the TAP stream."
      - "flags become a DIRECTORY of reusable, composable groups with a barrel: `lib/flags/index.js` re-exporting `lib/flags/<group>.js`, each group declared `/** @satisfies {import('peowly').AnyFlags} */` (diarie already does this part, just in one flat file)"
      - "each flag group owns BOTH halves — the definitions (`<group>Flags`) AND its validator (`validate<Group>Flags`) — in the same module, so a flag's declaration and its meaning cannot drift apart"
      - "the validators are pure, exported and UNIT-tested: they are the seam that is genuinely testable without a process (cf. list-dependents-cli `validateInputFlags`/`validateFilterFlags`, compare-eslint-configs `findDefaultConfig`). diarie's are currently trapped in `run()` — the `--filter` status guard and the `--days` numeric coercion"
      - "composition is by spread, INCLUDING subtractively: `...omit(outputFlags, ['named'])` is how a command takes a group minus one flag (list-dependents-cli/lib/commands/filter.js:56-61)"
      - "the `CommandContext` type is declared per command — as a local `@typedef` (peowly-commands' example) or centrally in `lib/cli-types.d.ts` (list-dependents-cli). Either is house style; pick one and be consistent"
      - "the line-building helpers (`← contains N open:` vs `← blocked by`) move out of `run()` into pure functions in `lib/format.js` and are unit-tested"
      - "the new unit tests go in `*.spec.js`; the spawn tests STAY and stay named `cli.spec.js` — the reference splits exactly this way (`audit.spec.js` pure vs `audit.cli.spec.js` spawn)"
      - "no behaviour change: all 161 assertions still pass, and the two pinned JSON shapes (`ready --json` OBJECT, `ready --filter` ARRAY) are byte-identical"
    description: >-
      **Read the shape, do not re-derive it.** Sources, in order of authority:


      - `peowly-commands/example/complete/commands/single/index.js` — the FOUR-part form
      (setupCommand → doTheWork → formatWorkResult). This is the target.

      - `peowly-commands/example/complete/commands/multi/one.js` — the three-part form, for a
      command with no separable output stage.

      - `list-dependents-cli/lib/commands/format.js` — the same, in production, with
      `lib/flags/` split into composable groups.


      diarie diverges: `commands/ready.js`'s `run()` is ~90 lines that parse, load, compute,
      build lines, print, and throw — in one function. Nothing inside it can be reached except by
      spawning a process.


      **The fourth part is the whole prize.** `doTheWork()` returns a typed `WorkResult`; it does
      not print. Only `formatWorkResult()` writes. That is what makes the *work* assertable
      in-process, and it is what diarie has no equivalent of.


      **Correcting an earlier draft of this row**, because the mistake is instructive: it claimed
      the goal was a "parse / act / render" split of my own invention, and separately claimed the
      house pattern made CLI tests unnecessary. Both were wrong, and reading the actual code
      refuted them — `compare-eslint-configs` **spawns** its CLI tests (`execFileAsync`),
      `setupCommand` is never exported, and the render layer returns `void`. So spawning the CLI
      is house style, not a diarie mistake, and diarie's existing pure-vs-spawn test split
      (`ready.spec.js` / `cli.spec.js`) already matches the reference's `audit.spec.js` /
      `audit.cli.spec.js`. What was genuinely missing was the `doTheWork` return value and the
      flag validators — narrower, and real.


      Motivating cost, measured: the one test that tried to drive `cli()` in-process had to
      monkey-patch `process.stdout.write`, which under `node --test` swallows the runner's own TAP
      stream — it silently dropped 40 of cli.spec.js's 54 results while still printing "pass".
      Worked around with a subprocess (2026-07-11); the fix is this row.


      Do this AFTER vp-beads-tst (done), never with it: moving 161 assertions in the same commit
      that changes what they assert is how a regression gets waved through. That is vp-beads-tst's
      own rule, and it binds its successor.


      **THREE CRITERIA ABOVE WERE NOT MET AS WRITTEN.** Recorded rather than quietly reworded,
      because a row that edits its own criteria to match what shipped is the green check this
      project keeps hunting:


      - *"the line-building helpers move into `lib/format.js`"* — they went to **`lib/ready.js`**
      instead, beside the `line()` they extend. `format.js` is the stdout/stderr IO module; a pure
      string builder does no IO, and `line`/`formatStats` already lived in `ready.js`. Following
      the criterion literally would have split two siblings across modules. The criterion's
      SUBSTANCE (pure, extracted, unit-tested) is met; only its address changed.

      - *"composition is by spread, INCLUDING subtractively (`...omit(outputFlags, [...])`)"* —
      **not done, deliberately.** diarie's shared groups are single-flag (`{json}`, `{root}`);
      there is nothing to subtract. Adding an `omit` helper to satisfy the line would have been
      cargo-culting the reference instead of the principle. Revive when a command genuinely needs
      a group-minus-a-flag.

      - *"`lib/flags/index.js` barrel ... (cf. list-dependents-cli)"* — the barrel shipped, but the
      citation was wrong: **list-dependents-cli has NO barrel**, it imports each group by path
      (`from '../flags/filter.js'`). The barrel is the peowly-commands *example's* convention. Both
      are house style. Fourth inference of the sprint refuted by opening the file.


      Also: `migrate` was left ALONE. It does not use peowly at all — its `--epic`/`--title` are
      repeatable `key=value` pairs parsed by `runMigration` — so it has no flag stage to reshape.
      Forcing the four parts onto it would have been inventing a shape, which is the exact error
      this row was rewritten to correct. `init` DID take the shape (its work is a side effect, but
      its output is separable).


      `doTheWork` is EXPORTED from each of the four commands. The reference keeps it internal —
      but the reference does not unit-test it, and in-process testability is this row's whole
      prize.


      Verified: 18 CLI invocations (stdout + stderr + exit code + `--help`) captured before the
      first edit and diffed after — **byte-identical**. The 161 assertions were the backstop, not
      the proof: they parse JSON, so a key-order change would have passed every one of them while
      breaking byte-identity. 21 new assertions (182 total), and all four new guards
      mutation-proven able to go red.


      **That matrix had a hole, and the hole was in the one path this project cares most about.**
      All 18 invocations ran against CLEAN stores, so none of them exercised a load warning —
      while the refactor had MOVED warning emission, from the `loadTasks(root, warn)` callback
      during the load to a replay at the top of `formatWorkResult`. The signature failure of this
      repo (a guard that drops without reporting) was sitting in an unverified path. Closed by
      re-running old-vs-new from a `git worktree` at HEAD~1 against a deliberately malformed store
      (bad priority + bd-fossil `type: bug` + scalar `labels:`): **byte-identical, all three
      warning lines, right order, `--strict` exit 2 included.** Lesson, and it generalizes: a
      diff matrix built only from healthy inputs cannot see a change to the unhealthy path.


      **`no behaviour change` was TOO STRONG. Two error-ordering changes, both surfaced by that
      same old-vs-new diff:**


      - *Fixed, by preserving the old order.* `setupCommand` initially validated `--filter` before
      resolving the store, which flipped the double fault (`--filter bogus --root /nowhere`) from
      `{code: "ENOSTORE"}` to a filter error — dropping the machine-readable code that
      `### Files-availability convention` makes load-bearing. `requireRoot` now runs first again.
      `stats` resolves in the opposite order and that asymmetry is ALSO preserved: both orders
      predate this row, and a refactor that quietly reorders errors is not a refactor.

      - *Kept, deliberately.* `--filter bogus` against a store that WOULD emit load warnings no
      longer prints those warnings first. The old code loaded the store before checking the flag;
      the new shape rejects invalid input before doing any work — which is what `setupCommand` is
      FOR, and preserving it would mean the validator could not live there at all. stdout and the
      exit code are unchanged; only advisory stderr differs, on a path where the input was already
      invalid. `format.js` defines stderr as asides, so this is within contract.
    updated: '2026-07-11'
  - id: vp-beads-asg
    title: diarie owns its gates; the root stops reaching in — ALL of them die at the split, not just ast-grep
    status: completed
    type: task
    priority: high
    parent: vp-beads-dia
    labels:
      - chore
    acceptance_criteria:
      - "THE PRINCIPLE: the workspace owns its gates and the root DELEGATES (`npm run check --workspace=diarie`) instead of reaching in. Today the root reaches into diarie with every gate it has (`tsc -p diarie`, `type-coverage -p diarie`, an eslint cliFiles glob, an ast-grep scan path, a knip workspace block) — which is exactly why none of them survive"
      - "diarie gets its OWN check aggregate: check:lint (own eslint.config.js + the eslint / @voxpelli/eslint-config devDeps, both root-only today), check:tsc, check:type-coverage, check:knip, check:ast-grep, check:ast-grep-test, plus @ast-grep/cli. Today `diarie/package.json` has exactly ONE script: `test`"
      - "root stops linting/typechecking/scanning `diarie/**`: eslint.config.js ignores it, knip.json drops the workspace block, check:tsc + check:type-coverage move out, check-ast-grep.mjs drops `diarie/lib/` + `diarie/test/`"
      - "COPY, DON'T MOVE. `no-hardcoded-tracker-dir` is CROSS-BOUNDARY — it guards diarie/lib/** AND scripts/audit-silent-skips.mjs, scripts/beads-probe.mjs, validate-plugin.mjs. It must exist on BOTH sides, each scoped to its own tree. (The original AC said `move`; that was wrong.)"
      - "the four generic JS rules are COPIED into diarie. ast-grep has NO config inheritance — sgconfig.yml supports only ruleDirs/utilDirs/testConfigs/customLanguages/languageGlobs/languageInjections, no extends/include. `share` was never an option. Accept the drift risk; log it"
      - "DELETE `no-identical-test-title` at the ROOT (rule + rule-test + snapshot). Once the root stops scanning diarie/test/, no *.spec.js exists outside diarie and the rule guards NOTHING — a green, inert rule, the precise sin this row exists to abolish. It lives in diarie now"
      - "FIX THE GUARD-OF-THE-GUARD: check-ast-grep.mjs must assert every scan path EXISTS and exit non-zero otherwise. MEASURED 2026-07-14: `ast-grep scan no-such-dir/` prints ERROR to stderr and EXITS 0, so `process.exit(result.status ?? 1)` goes GREEN while scanning nothing. Also de-duplicate the path list — `fix:ast-grep` hardcodes the same four paths a second time and can drift"
      - "RE-MEASURE the type-coverage ignore glob: `--ignore-files 'diarie/test/*'` was already measured a NO-OP once this sprint. After the move it becomes `test/*` — prove it matches and that the 98% ratchet still holds"
      - "update CLAUDE.md `## Validation` — it describes the check:* groups this row rewrites"
      - "PROVE it: plant a violation of each rule now living in diarie; diarie's OWN check must go red with NO root config present. A passing `ast-grep test` proves nothing — it takes no path argument, replays inline snapshots, and never walks the tree"
    description: >-
      Rewritten 2026-07-14 after three explorer agents. The original framing (`diarie must
      self-host its ast-grep config`) was a SUBSET of the real problem and got two premises wrong.


      What actually dies at the split is the whole quality-gate stack — ESLint (config AND deps),
      tsc, type-coverage's 98% ratchet, knip, CI — not only ast-grep. And `no-hardcoded-tracker-dir`
      cannot MOVE, because it guards both sides of the boundary.


      The rule's own point is the reason to care: a hardcoded path segment in guard code does not
      ERROR after a rename, it silently STOPS GUARDING. That is what would happen to the guards
      themselves, which is the joke this row exists to spoil.


      SHIPPED 2026-07-14. diarie now has its own sgconfig.yml + .ast-grep/ (8 rules), eslint.config.js,
      knip.jsonc, tsconfig, and a `check` aggregate of seven gates. The root delegates
      (`check:diarie` = `npm run check --workspace=diarie`), ignores `diarie/**` in eslint, and
      dropped check:tsc/check:type-coverage and the diarie scan paths.


      PROVEN, not assumed: an extracted copy (git init + npm install, no root config anywhere above
      it) passes all seven gates and 228 assertions — and every one of its five rules was proven to
      FIRE by planting a violation. The root's rules were likewise re-proven on the plugin tree.
      Coverage shrank on neither side.


      THE PROOF EARNED ITSELF IMMEDIATELY. Three gates that passed in-workspace FAILED standalone:


      1. `ast-grep scan` reported 24,894 errors — it was walking node_modules. The bare scan (no
         path list, deliberately, so a rule cannot be scoped outside what is scanned) is bounded by
         .gitignore, and diarie HAD NO .gitignore. In-workspace this is invisible because npm hoists
         deps to the root and `diarie/node_modules` is nearly empty: THE IN-WORKSPACE GREEN WAS AN
         ACCIDENT OF HOISTING.
      2. tsc + type-coverage broke on a JSDoc block I had just added ABOVE an existing one, orphaning
         its `@param` and making a parameter implicitly `any`.
      3. knip's ignoreBinaries/ignoreDependencies turned out to be needed ONLY in-workspace (measured:
         a standalone repo resolves all six without them). They are now in a knip.jsonc that says so
         in a comment, because a workaround you cannot explain in place will rot — left in after the
         split, knip could never again report a genuinely unused dependency.


      Also fixed along the way: knip found `init`'s `doTheWork` exported and never tested — the ONE
      command with a side effect and a refusal guard — now covered (4 tests, 228 total); and
      `projectRecords` exported for "vp-beads-bj7's eventual test suite", a migrator that IS built
      and does not use it. Tagged `@planned` with the reason, not deleted (ASK FIRST).


      A `git subtree split` of `diarie/` takes neither. The extracted package would ship with
      both guards gone and every check still green — which is the exact failure mode both rules
      were written to prevent, applied to the rules themselves.


      Also decide the sharing story for the four generic rules: duplicated files drift (see
      SYNERGY-vp-knowledge.md, where the byte-similar adoption is already logged as a drift
      risk), but a shared package is a dependency diarie may not want.
    updated: '2026-07-11'
  - id: vp-beads-tst
    title: Relocate diarie's tests into the workspace (node:test) — extraction-blocking
    status: completed
    type: task
    priority: high
    parent: vp-beads-dia
    labels:
      - chore
    acceptance_criteria:
      - tests live in `diarie/test/*.spec.js` using `node:test`, not in the plugin's `scripts/`
      - the root `check:ready-walker` / `check:tasks-validator` / `check:tasks-smoke` / `check:bootstrap` keys collapse to one `check:diarie` → `npm test --workspace=diarie`
      - "the mutation-verified guards survive the move: the container cases still run THROUGH loadTasks against a real store on disk (a unit test with inline arrays structurally cannot see the id-space bug)"
      - "`check:hooks` and `check:validator` stay with the plugin — they test the plugin, not the tracker"
      - "assertion parity is EXACT: 40/36/54/31 = 161 before, 161 after, per file"
      - "each of the four suites is proven able to go RED (one assertion falsified per file → non-zero exit). `pass 161` on its own proves nothing; `pass 0` also passed."
    description: >-
      DONE 2026-07-11. `npm test --workspace=diarie` reported **`pass 0`** while 1,238 lines of
      tests sat in the plugin's `scripts/` — a package about to be published whose own test
      command was vacuously green. 161 assertions moved to `diarie/test/{ready,validate,cli,
      migrate}.spec.js`, exact parity per file, converted to `node:test` describe/it.


      The real extraction blocker was one line: the migrator tests read their fixture from
      `.diarie/_archive/bd-final-export.jsonl` — the PLUGIN's frozen archive, which cannot
      exist in an extracted package. Replaced by a synthetic `test/fixtures/bd-export.jsonl`
      (19 records, 4.9 KB vs 272 KB) that covers MORE: every TYPE_MAP entry, both edge-drop
      paths, an unmappable priority, and the escaped-newline body.


      Three silent defects were found and fixed while wiring it up, each of which would have
      passed green:

      - `type-coverage`'s `--ignore-files` resolves from CWD, not the tsconfig dir. The
      template's `'test/*'` is a NO-OP here (measured: 5439/5593 either way) and would have
      dropped coverage to 97.24%, under the 98 gate — inviting a threshold cut. It must be
      `'diarie/test/*'`.

      - `scripts/check-ast-grep.mjs` scans an explicit path list. A rule scoped to
      `diarie/test/` would have been green and INERT; `ast-grep test` cannot catch that (it
      replays snapshots, it never walks the tree). Added `diarie/test/` to the runner and
      PROVED the rule fires by planting a duplicate.

      - Monkey-patching `process.stdout.write` under `node --test` swallows the runner's own
      TAP stream: it silently dropped 40 of cli.spec.js's 54 results while still reporting
      "pass". Replaced with a subprocess.


      Adding `test/**` to `diarie/tsconfig.json` type-checked the specs for the first time ever
      and immediately found real gaps (bare-id fixtures vs the `GlobalId` brand; `groupTasks`
      fixtures that were not `TaskRow`s).


      New guard: `.ast-grep/rules/no-identical-test-title.yml` — `node:test` runs BOTH copies of
      a duplicated `it()` title, silently. The tool for this (`eslint-node-test`) is
      UNINSTALLABLE here (peer `eslint >=10.4` vs eslint-config's `^9.38.0` — disjoint);
      reported upstream at voxpelli/eslint-config#476.
    updated: '2026-07-11'
