      - "🚨 THE ORIGINAL CRITERION HERE WAS WRONG and is corrected above: `ast-grep scan --json | length >= N` counts FINDINGS, not files — a HEALTHY tree has few or none, so it would go red on a clean repo and green on a blind one. Exactly backwards"
