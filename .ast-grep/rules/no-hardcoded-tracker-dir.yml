id: no-hardcoded-tracker-dir
language: javascript
message: >-
  Don't hardcode the tracker directory — import `TRACKER_DIR` from
  `diarie/schema` and build the path from it (`join(root, TRACKER_DIR,
  'tasks')`). The whole point of the constant is that renaming the store is a
  one-line change; a literal re-forks it. This bites hardest in *guard* code —
  bd-map.js's refuse-to-write check is a safety net, so a literal there would
  not error after a rename, it would silently stop guarding. The legacy
  `backlog/` segment (renamed to `.diarie/` 2026-07-11) is flagged too; the bare
  `backlog` PRIORITY value is not a path and is left alone.
severity: error
files:
  - "scripts/*.mjs"
  - "diarie/lib/**/*.js"
  - "diarie/test/**/*.js"
  - "validate-plugin.mjs"
ignores:
  # The definition itself — `export const TRACKER_DIR = '.diarie'`.
  - "diarie/lib/schema.js"
  # Test fixtures must state the literal: check-validator.mjs feeds planted
  # prose to auditSilentSkips (which now matches via TRACKER_DIR), and
  # check-hooks.mjs asserts on the path session-start.sh prints. Building
  # either from the constant would make the assertion tautological.
  - "scripts/check-*.mjs"
  # Same reason, for the same tests after they moved into the workspace: migrate.spec.js
  # asserts the migrator WROTE `.diarie/tasks/tasks-backlog.yml`, and an assertion that
  # builds that path from TRACKER_DIR proves only that the constant equals itself.
  #
  # This entry is deliberate, not decorative. `diarie/test/**` is in `files` ABOVE purely
  # so it can be ignored HERE — leave it out of both and the exemption still happens, but
  # by accident, invisibly, and nobody can tell an intended exemption from an oversight.
  - "diarie/test/**/*.js"
rule:
  any:
    - kind: string
    - kind: template_string
  regex: '\.diarie|backlog/'
