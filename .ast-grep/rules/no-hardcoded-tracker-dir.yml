id: no-hardcoded-tracker-dir
language: javascript
message: >-
  Don't hardcode the tracker directory — import `TRACKER_DIR` from
  `diarie/schema` and build the path from it (`join(root, TRACKER_DIR,
  'tasks')`). The whole point of the constant is that renaming the store is a
  one-line change; a literal re-forks it. This bites hardest in *guard* code —
  bd-map.js's refuse-to-write check is a safety net, so a literal there would
  not error after a rename, it would silently stop guarding. The legacy
  `backlog/` segment (renamed to `.diarie/` 2026-07-11) is flagged too; the bare
  `backlog` PRIORITY value is not a path and is left alone.
severity: error
# THE PLUGIN'S HALF of a cross-boundary rule. Its twin lives in `diarie/.ast-grep/rules/` and
# guards diarie's own `lib/**`. This copy guards the plugin's tooling — which imports `TRACKER_DIR`
# from `diarie/schema` precisely BECAUSE this rule makes it. The rule could not "move" with diarie;
# had it, the plugin's own tooling would have been free to re-fork the constant the day diarie left.
files:
  - "scripts/*.mjs"
  - "validate-plugin.mjs"
ignores:
  # Test fixtures must state the literal: check-validator.mjs feeds planted prose to
  # auditSilentSkips (which matches via TRACKER_DIR), and check-hooks.mjs asserts on the path
  # session-start.sh prints. Building either from the constant would make the assertion
  # tautological — it would prove only that the constant equals itself.
  - "scripts/check-*.mjs"
rule:
  any:
    - kind: string
    - kind: template_string
  regex: '\.diarie|backlog/'
