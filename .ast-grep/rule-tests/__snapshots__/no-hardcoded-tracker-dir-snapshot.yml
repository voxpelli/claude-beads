id: no-hardcoded-tracker-dir
snapshots:
  ? |
    const isStore = /^\.diarium\/tasks\//
  : labels:
    - source: /^\.diarium\/tasks\//
      style: primary
      start: 16
      end: 37
  ? |
    const p = `${root}/.diarie/tasks/tasks-x.yml`
  : labels:
    - source: '`${root}/.diarie/tasks/tasks-x.yml`'
      style: primary
      start: 10
      end: 45
  ? |
    const tasksDir = join(root, '.diarie', 'tasks')
  : labels:
    - source: '''.diarie'''
      style: primary
      start: 28
      end: 37
  ? |
    const tasksDir = join(root, '.diarium', 'tasks')
  : labels:
    - source: '''.diarium'''
      style: primary
      start: 28
      end: 38
  ? |
    const tasksDir = join(root, 'backlog/tasks')
  : labels:
    - source: '''backlog/tasks'''
      style: primary
      start: 28
      end: 43
  ? |
    const tasksDir = join(root, 'diarium', 'tasks')
  : labels:
    - source: '''diarium'''
      style: primary
      start: 28
      end: 37
  ? |
    if (/\.diarie\/tasks/.test(p)) return true
  : labels:
    - source: /\.diarie\/tasks/
      style: primary
      start: 4
      end: 21
  ? |
    stderr.write('refusing to write under .diarie/tasks/\n')
  : labels:
    - source: '''refusing to write under .diarie/tasks/\n'''
      style: primary
      start: 13
      end: 55
