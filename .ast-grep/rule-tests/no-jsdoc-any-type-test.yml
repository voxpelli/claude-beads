# Tests a rule this repo CONSUMES from `@voxpelli/ast-grep-rules`, not one it owns. ast-grep pairs a
# test to a rule by the `id:` field, wherever the rule was loaded from — including a `ruleDirs` entry
# inside `node_modules` — so this file is what makes a neutered upstream pattern go RED here.
id: no-jsdoc-any-type
valid:
- "/** @param {unknown} x */"
- "/** @returns {string} */"
invalid:
- "/** @param {any} x */"
- "/** @returns {any} */"
